spring.application.name=ambulance-tracking-backend
# PORT is injected by Render/Railway/Fly.io at runtime; falls back to 8080 locally.
server.port=${PORT:8080}

# ---- MySQL ----
# Every value here can be overridden by an environment variable of the same
# name (Spring's standard ${VAR:default} syntax) - locally it falls back to
# your local MySQL on root/root; in production you set these as real env
# vars on your hosting platform and never commit real credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ambulance_tracking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# 256-bit+ secret. The default below is fine for local dev only - always set
# APP_JWT_SECRET as a real env var in production (a long random string).
app.jwt.secret=${APP_JWT_SECRET:ChangeThisToALongRandomSecretKeyForJWTSigning1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
# Comma-separated. Locally: Vite (5173) and CRA-style (3000). In production,
# set APP_CORS_ALLOWED_ORIGINS to your real deployed frontend URL(s).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging.level.org.springframework.security=INFO
